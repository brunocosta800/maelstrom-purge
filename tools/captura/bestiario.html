<!DOCTYPE html>
<html lang="pt-BR">
<!-- Estúdio de retratos do bestiário: renderiza um inimigo (ou as armas) com os materiais reais do jogo,
     fundo transparente. Uso: /tools/captura/bestiario.html?t=imp  (zumbi, puglin, imp, impElite, boss, armas) -->
<head><meta charset="UTF-8"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from 'three/webgpu';
import { loadAssets, assets } from '/src/game/assets.js';
import { Enemy, prepareEnemyTemplates, TYPES } from '/src/game/enemies.js';
import { prepareGuns } from '/src/game/weapons.js';
import { poseHumanoid } from '/src/game/rig.js';
import { gameTime } from '/src/shaders/world.js';

const t = new URLSearchParams(location.search).get('t') || 'imp';
const renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
await renderer.init();

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffe8f0, 0x200810, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(-2, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x4fe3f0, 3.5); rim.position.set(4, 3, -4); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xff3b4e, 3.0); rim2.position.set(-4, 2, -3); scene.add(rim2);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);

await loadAssets(() => {});
prepareGuns();
prepareEnemyTemplates();

if (t === 'armas') {
    const keys = ['pistol', 'shotgun', 'rifle', 'plasma', 'rail', 'lightning'];
    keys.forEach((k, i) => {
        const g = assets.guns[k].clone();
        const box = new THREE.Box3().setFromObject(g); const s = box.getSize(new THREE.Vector3());
        g.scale.multiplyScalar(1.0 / s.z);
        g.rotation.y = -Math.PI / 2 + 0.35;
        g.rotation.z = 0.08;
        const col = i % 3, row = Math.floor(i / 3);
        g.position.set((col - 1) * 1.25, (0.5 - row) * 0.75, 0);
        scene.add(g);
    });
    camera.position.set(0, 0.3, 5.2); camera.lookAt(0, 0, 0);
} else {
    const game = { scene, difficulty: 'normal' };
    const e = new Enemy(game, t, new THREE.Vector3(0, 0, 0));
    e.setFx('dissolve', 0);
    e.group.rotation.y = 0.45;
    const T = TYPES[t];
    const poses = {
        zumbi: { walk: 1.2, stride: 0.7, lean: 0.25, armDown: 0.05, armsForward: 1.4, headRoll: 0.2 },
        puglin: { walk: 0.8, stride: 1.0, lean: 0.45, armDown: 1.25, armR: -1.6, elbowR: 0.4, crouch: 0.25 },
        imp: { walk: 0.5, stride: 0.4, lean: 0.1, armDown: 1.2, armR: -2.6, elbowR: 0.9 },
        impElite: { walk: 2.0, stride: 0.5, lean: 0.05, armDown: 1.2, armR: -2.4, armL: -0.8, elbowR: 0.8 },
        boss: { walk: 0, stride: 0.2, lean: -0.15, armDown: 1.2, armL: -2.8, armR: -2.8, headPitch: -0.3 },
    };
    poseHumanoid(e.rig, poses[t]);
    e.updateHead();
    gameTime.value = 1.3;
    const h = T.height;
    const dist = h * 2.25 + 0.5;
    camera.position.set(0, h * 0.6, dist);
    camera.lookAt(0, h * 0.58, 0);
}
renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.__ready = true;
</script>
</body>
</html>
