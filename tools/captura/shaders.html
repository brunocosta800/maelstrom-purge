<!DOCTYPE html>
<html lang="pt-BR">
<!-- Estúdio de shaders: renderiza UM shader do jogo isolado, para gerar as amostras da apresentação.
     Uso: /tools/captura/shaders.html?s=totem  (totem, parede, caixote, chao, lava, ceu, inimigo,
     particulas, fogo, portal, raios, onda) -->
<head><meta charset="UTF-8"><style>html,body{margin:0;background:#0e070c;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from 'three/webgpu';
import { pass } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { gameTime, accent, accent2, skyFlash, neonTotemMaterial, wallMaterial, crateMaterial, floorMaterial, lavaMaterial, skyNode } from '/src/shaders/world.js';
import { orbMaterial, portalMaterial, portalOpen, shockwaveMaterial } from '/src/shaders/entities.js';
import { Effects } from '/src/game/effects.js';

const s = new URLSearchParams(location.search).get('s') || 'totem';
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
await renderer.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e070c);
scene.add(new THREE.HemisphereLight(0xb07090, 0x201018, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(4, 8, 6); scene.add(key);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 300);
accent.value.setHex(0xff2a6d); accent2.value.setHex(0x00e5ff);
gameTime.value = 1.6;
const box = (w, h, d, mat, x = 0, y = h / 2, z = 0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); scene.add(m); return m; };
const look = (p, t) => { camera.position.set(...p); camera.lookAt(...t); };

if (s === 'totem') {
    box(2.4, 8, 2.4, neonTotemMaterial(), 0, 4, 0).rotation.y = 0.6;
    gameTime.value = 0.7;
    look([0, 4, 11], [0, 4, 0]);
} else if (s === 'parede') {
    const m = wallMaterial();
    for (let i = -2; i <= 2; i++) box(4, 6, 4, m, i * 4 + 2, 3, -2);
    box(4, 6, 4, m, -10, 3, 2); box(4, 6, 4, m, 14, 3, 2);
    gameTime.value = 2.2;
    look([-3, 2.2, 7], [3, 2.6, -1]);
} else if (s === 'caixote') {
    const m = crateMaterial();
    box(3.6, 2.2, 3.6, m, 2, 1.1, 2); box(3.6, 2.2, 3.6, m, 6, 1.1, 2); box(3.6, 2.2, 3.6, m, 2, 1.1, -2);
    const f = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMaterial()); f.rotation.x = -Math.PI / 2; scene.add(f);
    look([-4.5, 3.4, 9], [3.5, 1.0, 0.5]);
} else if (s === 'chao') {
    const f = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMaterial()); f.rotation.x = -Math.PI / 2; scene.add(f);
    gameTime.value = 1.15; // onda de energia passando a ~8 m da origem
    look([0, 3.2, 7], [0, 0, -6]);
} else if (s === 'lava') {
    const g = new THREE.PlaneGeometry(16, 10); g.rotateX(-Math.PI / 2);
    scene.add(new THREE.Mesh(g, lavaMaterial(0xff6a00, 0x2a0300)));
    gameTime.value = 5.0;
    look([0, 6, 7], [0, 0, 0]);
} else if (s === 'ceu') {
    scene.backgroundNode = skyNode();
    gameTime.value = 4.0; skyFlash.value = 0.2; // clarão de relâmpago
    look([0, 1.7, 0], [0, 3, -10]);
} else if (s === 'fogo') {
    [['fire', 0xffe9a0, 0xff3a00], ['void', 0xffd0ff, 0x8a00ff], ['plasma', 0xe0ffff, 0x00a0ff]].forEach(([, c, r], i) => {
        const sp = new THREE.Sprite(orbMaterial(c, r)); sp.scale.setScalar(2.2); sp.position.set((i - 1) * 2.8, 1.5, 0); scene.add(sp);
    });
    look([0, 1.5, 7], [0, 1.5, 0]);
} else if (s === 'portal') {
    portalOpen.value = 1;
    const d = new THREE.Mesh(new THREE.CircleGeometry(1.7, 64), portalMaterial()); d.position.y = 2; scene.add(d);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.12, 16, 64), new THREE.MeshStandardNodeMaterial({ color: 0x111111, emissive: 0x20ffe0, emissiveIntensity: 2.5 }));
    ring.position.y = 2; scene.add(ring);
    gameTime.value = 2.3;
    renderer.toneMappingExposure = 0.45; // só para a foto: o portal aberto satura a câmera
    look([0, 2, 6], [0, 2, 0]);
} else if (s === 'onda') {
    const fx = new Effects(scene);
    const f = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMaterial()); f.rotation.x = -Math.PI / 2; scene.add(f);
    const r = fx.shockwave(new THREE.Vector3(0, 0, 0)); r.scale.setScalar(7); r.userData.k = 0.25;
    look([0, 7, 13], [0, 0, -1]);
} else if (s === 'raios' || s === 'particulas') {
    const fx = new Effects(scene);
    const f = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMaterial()); f.rotation.x = -Math.PI / 2; scene.add(f);
    gameTime.value = 10;
    if (s === 'raios') {
        fx.beam(new THREE.Vector3(-4, 2.2, 2), new THREE.Vector3(4, 1.4, -6), 'bullet', 0.06, 999);
        fx.beam(new THREE.Vector3(-4, 1.4, 1), new THREE.Vector3(5, 2.2, -8), 'rail', 0.16, 999);
        fx.lightning(new THREE.Vector3(-3, 3.2, 0), new THREE.Vector3(4, 3.0, -5));
        fx.beams.forEach(b => { if (b.visible) { b.userData.life = 999; b.userData.max = 999; } });
    } else {
        fx.bloodBurst(new THREE.Vector3(-2.6, 1.4, 0), new THREE.Vector3(0.3, 0.6, 0.5), 40, 1.3);
        fx.sparks(new THREE.Vector3(0.4, 1.6, -1), new THREE.Vector3(0, 0.4, 1), [1, 0.75, 0.35], 26);
        fx.explosion(new THREE.Vector3(3.2, 1.6, -1), 2.2, [0.3, 0.9, 1.0]);
        gameTime.value = 10.16;
    }
    fx.update(0);
    look([0, 2.4, 8], [0, 1.4, -1]);
}

const pipeline = new THREE.RenderPipeline(renderer);
const sp = pass(scene, camera);
const col = sp.getTextureNode('output');
pipeline.outputNode = col.add(bloom(col, 0.8, 0.4, 0.6));
renderer.setAnimationLoop(() => pipeline.render());
window.__ready = true;
</script>
</body>
</html>
